<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Request Received — Spotify × TIFF 2026</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;background:#000;color:#fff;line-height:1.6;-webkit-font-smoothing:antialiased;display:flex;align-items:center;justify-content:center;min-height:100vh}
.wrap{max-width:640px;margin:0 auto;padding:0 24px;text-align:center}
.checkmark{font-size:48px;color:#1db954;margin-bottom:16px}
h1{font-size:28px;font-weight:700;margin-bottom:12px;color:#fff}
.msg{color:#999;font-size:16px;line-height:1.7;margin-bottom:32px}
.back{display:inline-block;background:#1db954;color:#000;padding:12px 32px;border-radius:10px;font-size:15px;font-weight:700;text-decoration:none;transition:opacity .2s}
.back:hover{opacity:.9;text-decoration:none}
footer{color:#444;font-size:13px;margin-top:40px}
</style>
</head>
<body>
<div class="wrap">
  <div class="checkmark">✓</div>
  <h1>Request Received</h1>
  <p class="msg">Thank you! Your screening request has been received.<br>We will confirm your ticket availability shortly.</p>
  <a class="back" href="https://ent-user.github.io/tiff-2026-screenings/">Back to Screenings</a>
  <footer><p>Spotify Canada · TIFF 2026 Client Screenings</p></footer>
</div>
</body>
</html>
